name: check-examples

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::ggplot2
            any::stringr
            any::stringi
            any::arrow
            any::duckdb
            any::profvis
            any::bench
            any::lubridate
            any::S7
            any::here
            any::testthat
            any::targets
            any::tarchetypes
            any::crew
            any::quarto
            any::lme4
      - name: Every guide block runs and R-dev-examples.R is current
        run: Rscript check-examples.R
      - name: The checker's own tests
        run: Rscript -e 'testthat::test_dir("tests", stop_on_failure = TRUE)'
